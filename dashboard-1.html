<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد زنده نظرسنجی | کنگره ارتوپدی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0E2A3B; --navy-2:#123549; --gold:#C8922B; --gold-light:#E8B85A;
    --paper:#F7F4EE; --ink:#182226; --muted:#66767D; --line:#DDD6C7; --ok:#2E6E52; --radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Vazirmatn',sans-serif;}
  header{
    background:var(--navy);color:#fff;padding:20px 32px;
    border-bottom:3px solid var(--gold);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  header h1{margin:0;font-size:19px;}
  header .live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gold-light);}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .wrap{max-width:1300px;margin:0 auto;padding:26px 24px 80px;}

  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;}
  .stat .n{font-size:32px;font-weight:800;color:var(--navy);}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s;}
  .card:hover{border-color:var(--gold);}
  .card.active{border-color:var(--navy);border-width:2px;}
  .card h3{margin:0 0 3px;font-size:14px;line-height:1.6;}
  .card .sp{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .card .avgrow{display:flex;justify-content:space-between;align-items:baseline;}
  .card .avg{font-size:26px;font-weight:800;color:var(--navy);}
  .card .cnt{font-size:12px;color:var(--muted);}

  .detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-top:28px;}
  .detail h2{margin:0 0 4px;font-size:18px;}
  .detail .sp{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;}
  @media (max-width:820px){.detail-grid{grid-template-columns:1fr;} .overview{grid-template-columns:repeat(2,1fr);}}
  .comments{max-height:340px;overflow-y:auto;}
  .comment{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;line-height:1.8;}
  .comment:last-child{border-bottom:none;}
  .comment .t{font-size:11px;color:var(--muted);margin-top:4px;}
  .nocomment{color:var(--muted);font-size:13px;}
  .backBtn{
    background:none;border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--muted);margin-bottom:14px;
  }
  .hidden{display:none !important;}
  .empty{color:var(--muted);padding:40px;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>داشبورد زنده نظرسنجی کنگره</h1>
  <div class="live"><span class="dot"></span> به‌روزرسانی خودکار</div>
</header>

<div class="wrap">
  <div class="overview" id="overview">
    <div class="stat"><div class="n" id="ovSessions">0</div><div class="l">تعداد سخنرانی</div></div>
    <div class="stat"><div class="n" id="ovResponses">0</div><div class="l">مجموع پاسخ‌ها</div></div>
    <div class="stat"><div class="n" id="ovAvg">—</div><div class="l">میانگین کلی کیفیت</div></div>
    <div class="stat"><div class="n" id="ovComments">0</div><div class="l">نظر متنی ثبت‌شده</div></div>
  </div>

  <div id="listView">
    <div id="sessionGrid" class="grid"></div>
    <div id="emptyMsg" class="empty hidden">هنوز سخنرانی‌ای ثبت نشده است.</div>
  </div>

  <div id="detailView" class="detail hidden">
    <button class="backBtn" id="backBtn">← بازگشت به نمای کلی</button>
    <h2 id="dTitle"></h2>
    <div class="sp" id="dSpeaker"></div>
    <div class="detail-grid">
      <div><canvas id="dChart" height="220"></canvas></div>
      <div>
        <h3 style="font-size:14px;margin:0 0 10px;">نظرات متنی (<span id="dCommentCount">0</span>)</h3>
        <div class="comments" id="dComments"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ===================== تنظیمات Firebase =====================
  const firebaseConfig = {
    apiKey: "AIzaSyBwHshrueUdn_jFQVYdX_91-QRtc09Divk",
    authDomain: "congress-survay.firebaseapp.com",
    databaseURL: "https://congress-survay-default-rtdb.firebaseio.com",
    projectId: "congress-survay",
    storageBucket: "congress-survay.firebasestorage.app",
    messagingSenderId: "499198284243",
    appId: "1:499198284243:web:b34bf19d06d47680d39f26",
    measurementId: "G-9PSHSKSDQT"
  };
  // ===============================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const QUESTIONS = [
    {key:'quality', label:'کیفیت علمی'},
    {key:'applicability', label:'کاربردی بودن'},
    {key:'presentation', label:'کیفیت ارائه'},
    {key:'timing', label:'مدیریت زمان'}
  ];

  let sessions = {};
  let responses = {};
  let activeId = null;
  let chart = null;

  db.ref('sessions').on('value', snap => {
    sessions = snap.val() || {};
    renderAll();
  });
  db.ref('responses').on('value', snap => {
    responses = snap.val() || {};
    renderAll();
    if(activeId) renderDetail(activeId);
  });

  function avg(arr){
    if(!arr.length) return null;
    return arr.reduce((a,b)=>a+b,0) / arr.length;
  }

  function sessionStats(id){
    const rs = responses[id] ? Object.values(responses[id]) : [];
    const stats = {};
    QUESTIONS.forEach(q => {
      stats[q.key] = avg(rs.map(r => r[q.key]).filter(v => typeof v === 'number'));
    });
    const overallVals = rs.map(r => QUESTIONS.reduce((sum,q)=>sum+(r[q.key]||0),0)/QUESTIONS.length);
    stats.overall = avg(overallVals);
    stats.count = rs.length;
    stats.comments = rs.filter(r => r.suggestion && r.suggestion.trim()).map(r => ({text:r.suggestion, ts:r.timestamp}));
    return stats;
  }

  function renderAll(){
    const grid = document.getElementById('sessionGrid');
    const ids = Object.keys(sessions);
    document.getElementById('emptyMsg').classList.toggle('hidden', ids.length > 0);
    grid.innerHTML = '';

    let totalResponses = 0, totalComments = 0, overallSum = 0, overallN = 0;

    ids.forEach(id => {
      const s = sessions[id];
      const st = sessionStats(id);
      totalResponses += st.count;
      totalComments += st.comments.length;
      if(st.overall !== null){ overallSum += st.overall; overallN++; }

      const card = document.createElement('div');
      card.className = 'card' + (id === activeId ? ' active' : '');
      card.innerHTML = `
        <h3>${escapeHtml(s.title)}</h3>
        <div class="sp">${escapeHtml(s.speaker || '')}</div>
        <div class="avgrow">
          <span class="avg">${st.overall !== null ? st.overall.toFixed(1) : '—'}</span>
          <span class="cnt">${st.count} پاسخ</span>
        </div>
      `;
      card.addEventListener('click', () => showDetail(id));
      grid.appendChild(card);
    });

    document.getElementById('ovSessions').textContent = ids.length;
    document.getElementById('ovResponses').textContent = totalResponses;
    document.getElementById('ovAvg').textContent = overallN ? (overallSum/overallN).toFixed(1) : '—';
    document.getElementById('ovComments').textContent = totalComments;
  }

  function showDetail(id){
    activeId = id;
    document.getElementById('listView').classList.add('hidden');
    document.getElementById('detailView').classList.remove('hidden');
    renderDetail(id);
    renderAll();
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    activeId = null;
    document.getElementById('detailView').classList.add('hidden');
    document.getElementById('listView').classList.remove('hidden');
  });

  function renderDetail(id){
    const s = sessions[id];
    if(!s) return;
    const st = sessionStats(id);
    document.getElementById('dTitle').textContent = s.title;
    document.getElementById('dSpeaker').textContent = (s.speaker || '') + ' — ' + st.count + ' پاسخ ثبت‌شده';

    const ctx = document.getElementById('dChart').getContext('2d');
    const data = QUESTIONS.map(q => st[q.key] || 0);
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: QUESTIONS.map(q => q.label),
        datasets: [{ data, backgroundColor: '#0E2A3B', borderRadius: 3, maxBarThickness: 48 }]
      },
      options: {
        indexAxis: 'y',
        scales: { x: { min:0, max:5, ticks:{stepSize:1} } },
        plugins: { legend: { display:false } },
        animation: { duration: 300 }
      }
    });

    const cWrap = document.getElementById('dComments');
    document.getElementById('dCommentCount').textContent = st.comments.length;
    if(!st.comments.length){
      cWrap.innerHTML = '<div class="nocomment">هنوز نظر متنی ثبت نشده است.</div>';
    } else {
      cWrap.innerHTML = st.comments
        .sort((a,b) => (b.ts||0)-(a.ts||0))
        .map(c => `<div class="comment">${escapeHtml(c.text)}</div>`)
        .join('');
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
</script>
</body>
</html>
